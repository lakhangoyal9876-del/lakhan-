
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Form</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f2f2f2);
            min-height: 100vh;
        }

        .booking-card {
            max-width: 650px;
            margin: 40px auto;
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .card-header {
            background-color: #198754;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 15px 15px 0 0 !important;
        }

        .btn-book {
            background-color: #198754;
            color: white;
        }

        .btn-book:hover {
            background-color: #146c43;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card booking-card">

        <div class="card-header">
            <h2 class="mb-0">Hotel Booking Form</h2>
            <p class="mb-0 mt-2">Book your comfortable stay with us</p>
        </div>

        <div class="card-body p-4">

            <form action="a" method="post">

                <!-- Full Name -->
                <div class="mb-3">
                    <label for="FullName" class="form-label">
                        Full Name:
                    </label>
                    <input type="text" class="form-control"
                           name="FullName" id="FullName"
                           placeholder="Enter your full name" required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="Email" class="form-label">
                        Email:
                    </label>
                    <input type="email" class="form-control"
                           name="Email" id="Email"
                           placeholder="Enter your email" required>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label for="Phone" class="form-label">
                        Phone:
                    </label>
                    <input type="tel" class="form-control"
                           name="Phone" id="Phone"
                           placeholder="Enter your phone number" required>
                </div>

                <!-- Check In and Check Out -->
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="CheckIn" class="form-label">
                            Check In:
                        </label>
                        <input type="date" class="form-control"
                               name="CheckIn" id="CheckIn" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="CheckOut" class="form-label">
                            Check Out:
                        </label>
                        <input type="date" class="form-control"
                               name="CheckOut" id="CheckOut" required>
                    </div>

                </div>

                <!-- Room Type -->
                <div class="mb-3">
                    <label for="RoomType" class="form-label">
                        Room Type:
                    </label>

                    <select class="form-select"
                            name="RoomType" id="RoomType" required>

                        <option value="">Select Room Type</option>
                        <option value="Single">Single</option>
                        <option value="Double">Double</option>
                        <option value="Luxury">Luxury</option>
                        <option value="Suite">Suite</option>

                    </select>
                </div>

                <!-- Number of Guests -->
                <div class="mb-3">
                    <label for="Guests" class="form-label">
                        Number of Guests:
                    </label>

                    <input type="number" class="form-control"
                           name="Guests" id="Guests"
                           min="1" max="10"
                           placeholder="Enter number of guests" required>
                </div>

                <!-- Special Requests -->
                <div class="mb-3">
                    <label for="SpecialRequests" class="form-label">
                        Special Requests:
                    </label>

                    <textarea class="form-control"
                              name="SpecialRequests"
                              id="SpecialRequests"
                              rows="4"
                              placeholder="Enter your special requests"></textarea>
                </div>

                <!-- Buttons -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">

                    <button type="submit" class="btn btn-book px-4">
                        Book Now
                    </button>

                    <button type="reset" class="btn btn-secondary px-4">
                        Reset Form
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
